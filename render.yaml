services:
  - type: web
    name: regai-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.api
    envVarGroups:
      - regai-secrets
    healthCheckPath: /health

  # Crawl execution: GitHub Actions (.github/workflows/crawl-worker.yml)
  # RAG indexing: GitHub Actions (.github/workflows/rag-index.yml) → POST /admin/rag/process
  # Do not add a Render Background Worker or Render Cron for crawl/RAG (paid).

  - type: web
    name: regai-frontend
    runtime: static
    buildCommand: npm ci && npm run build --workspace @regulatory-ai/web
    staticPublishPath: apps/web/dist/client
