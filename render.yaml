services:
  - type: web
    name: regai-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.api
    envVarGroups:
      - regai-secrets
    healthCheckPath: /health

  - type: cron
    name: regai-pipeline
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.pipeline
    schedule: "30 1 * * *"
    envVarGroups:
      - regai-secrets

  # Drain rag_index_jobs that crawls only enqueue. Without this cron, PENDING
  # jobs accumulate until someone manually hits admin /rag/process or the CLI.
  - type: cron
    name: regai-rag-index
    runtime: docker
    dockerfilePath: apps/api/Dockerfile.api
    dockerCommand: python -m backend.tools.rag_index_worker --limit 50
    schedule: "*/15 * * * *"
    envVarGroups:
      - regai-secrets

  - type: web
    name: regai-frontend
    runtime: static
    buildCommand: npm ci && npm run build --workspace @regulatory-ai/web
    staticPublishPath: apps/web/dist/client
